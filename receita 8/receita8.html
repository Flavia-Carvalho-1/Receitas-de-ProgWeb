<!DOCTYPE html>

<html>

   <head>
      <meta charset="UTF-8">
      <title>Consumindo API</title>

      <link href="estilo8.css" rel="stylesheet">
   </head>

   <body>

      <h1>Usuários</h1>
      <div><button id="botaoUsuarios">Carregar usuários</button></div>
      <div id="usuariosDiv"></div>

      <h1>posts</h1>
      <div><button id="botaoposts">Carregar posts</button></div>
      <div id="postsDiv"></div>

   </body>

   <script src="receita8.js"></script>

   <script>

      const achatarUsuario = (u) => ({
         name: u.name,
         email: u.email,
         cidade: u.address.city,
         empresa: u.company.name
      })

      const carregarUsuarios = () => {
         fetch("https://jsonplaceholder.typicode.com/users").then(
            res => res.json()
         ).then(
            usuarios => {
               let usuariosFormatados = usuarios.map(achatarUsuario)
               montarTabela(
                  usuariosFormatados,
                  "usuariosDiv",
                  ["Nome", "Email", "Cidade", "Empresa"],
                  ["name", "email", "cidade", "empresa"]
               )
            }
         ).catch(
            err => document.getElementById("usuariosDiv").innerHTML = `Não foi possível carregar os usuários. ${err}`
         )
      }

      const carregarposts = () => {
         fetch("https://jsonplaceholder.typicode.com/posts").then(
            res => res.json()
         ).then(
            posts => montarTabela(
               posts,
               "postsDiv",
               ["Título", "Conteúdo"],
               ["title", "body"]
            )
         ).catch(
            err => document.getElementById("postsDiv").innerHTML = `Não foi possível carregar as posts. ${err}`
         )
      }

      let botaoUsuarios = document.getElementById("botaoUsuarios")
      let botaoposts = document.getElementById("botaoposts")

      botaoUsuarios.addEventListener("click", () => carregarUsuarios() )
      botaoposts.addEventListener("click", () => carregarposts() )

   </script>

</html>
